<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Ultimate HTML5 Tag Showcase</title>

    <link rel="stylesheet" href="styles/main.css">

</head>

<body class="page">

    <header class="page__header">
        <nav class="navigation" aria-label="navigation">
            <div class="navigation__content">
                <ul class="navigation__list">
                    <li class="navigation__item">
                        <a href="main.html" class="navigation__link">link to home</a>
                    </li>
                </ul>
            </div>
        </nav>

    </header>


    <!-- Forms & User Input -->
    <section class="region">
        <h2 class="region__title">
            Forms &amp; User Input (Extended)
        </h2>

        <div class="panel-group">
            <article class="panel hover:-translate-y-1 transition-all duration-300">
                <h3 class="panel__title">Text-Based <code>&lt;input&gt;</code> of various <code>type</code>
                    attributes and a <code>&lt;textarea&gt;</code></h3>

                <div class="panel__content">

                    <form class="user-form space-y-4">
                        <div class="user-form__field">
                            <label for="text-in" class="annotation annotation--block">Text</label>
                            <div class="user-form__control">
                                <p class="user-form__hint">hint</p>
                                <input type="text" id="text-in" class="form-input" placeholder="Standard text">
                            </div>
                        </div>

                        <div class="user-form__field">

                            <label for="email-in" class="annotation annotation--block">Email</label>
                            <input type="email" id="email-in" class="form-input" placeholder="name@example.com">
                        </div>

                        <div class="user-form__field">

                            <label for="password-in" class="annotation annotation--block">Password</label>
                            <input type="password" id="password-in" class="form-input" autocomplete="new-password">
                        </div>

                        <div class="user-form__field">

                            <label for="tel-in" class="annotation annotation--block">Telephone</label>
                            <input type="tel" id="tel-in" class="form-input" placeholder="123-456-7890">
                        </div>

                        <div class="user-form__field">

                            <label for="url-in" class="annotation annotation--block">URL</label>
                            <input type="url" id="url-in" class="form-input" placeholder="https://example.com">
                        </div>

                        <div class="user-form__field">

                            <label for="search-in" class="annotation annotation--block">Search</label>
                            <input type="search" id="search-in" class="form-input" placeholder="Search...">
                        </div>

                        <div class="user-form__field">

                            <label for="textarea-in" class="annotation annotation--block">Textarea</label>
                            <textarea id="textarea-in" rows="2" class="form-input"></textarea>
                        </div>

                    </form>
                </div>

            </article>

            <article class="panel hover:-translate-y-1 transition-all duration-300">
                <h3 class="panel__title">Choices &amp; Selections</h3>

                <div class="panel__content">

                    <form class="user-form space-y-4">
                        <fieldset class="choice-group">
                            <legend class="choice-group__label font-semibold text-sm">Radio Group</legend>

                            <div class="mt-2 space-y-1">
                                <div class="choice-group__option flex items-center space-x-2">
                                    <input type="radio" id="radio1" name="choice"
                                        class="h-4 w-4 text-blue-600 focus:ring-blue-500">
                                    <label for="radio1">Choice One</label>
                                </div>

                                <div class="choice-group__option flex items-center space-x-2">
                                    <input type="radio" id="radio2" name="choice"
                                        class="h-4 w-4 text-blue-600 focus:ring-blue-500" checked>
                                    <label for="radio2">Choice Two</label>
                                </div>

                            </div>
                        </fieldset>

                        <fieldset class="choice-group">
                            <legend class="choice-group__label font-semibold text-sm">Checkbox Group</legend>

                            <div class="mt-2 space-y-1">
                                <div class="choice-group__option flex items-center space-x-2">
                                    <input type="checkbox" id="check1"
                                        class="h-4 w-4 rounded text-blue-600 focus:ring-blue-500" checked>
                                    <label for="check1">Option A</label>
                                </div>
                                <div class="choice-group__option flex items-center space-x-2">
                                    <input type="checkbox" id="check2"
                                        class="h-4 w-4 rounded text-blue-600 focus:ring-blue-500">
                                    <label for="check2">Option B</label>
                                </div>
                            </div>
                        </fieldset>

                        <div class="user-form__field">
                            <label for="dropdown" class="annotation annotation--block">Select Dropdown</label>
                            <select id="dropdown" class="form-input">
                                <optgroup label="Primary">
                                    <option>Option A</option>
                                </optgroup>
                                <optgroup label="Secondary">
                                    <option>Option C</option>
                                </optgroup>
                            </select>
                        </div>

                        <div class="user-form__field">
                            <label for="ice-cream-choice" class="annotation annotation--block">Datalist
                                (Autocomplete)</label>
                            <input type="search" list="ice-cream-flavors" id="ice-cream-choice" name="ice-cream-choice"
                                class="form-input">
                            <datalist id="ice-cream-flavors">
                                <option value="Chocolate"></option>
                                <option value="Vanilla"></option>
                                <option value="Strawberry"></option>
                            </datalist>
                        </div>

                    </form>
                </div>

            </article>

            <article class="panel hover:-translate-y-1 transition-all duration-300">
                <h3 class="panel__title">Pickers, Ranges &amp; Files</h3>

                <div class="panel__content">

                    <form class="user-form space-y-4">
                        <div class="user-form__field">

                            <label for="range-in" class="block text-sm font-medium">Range</label>
                            <input type="range" id="range-in" class="w-full accent-blue-600">
                        </div>

                        <div class="user-form__field">

                            <label for="date-in" class="annotation annotation--block">Date</label>
                            <input type="date" id="date-in" class="form-input">
                        </div>

                        <div class="user-form__field">

                            <label for="month-in" class="annotation annotation--block">Month</label>
                            <input type="month" id="month-in" class="form-input">
                        </div>

                        <div class="user-form__field">

                            <label for="week-in" class="annotation annotation--block">Week</label>
                            <input type="week" id="week-in" class="form-input">
                        </div>

                        <div class="user-form__field">

                            <label for="color-in" class="block text-sm font medium mb-1">Color</label>
                            <input type="color" id="color-in" value="#2563eb" class="h-10 w-full rounded-md">
                        </div>

                        <div class="user-form__field">

                            <label for="file-in" class="annotation annotation--block">File Upload</label>
                            <input type="file" id="file-in" class="form-input">
                        </div>

                    </form>
                </div>

            </article>

            <article class="panel hover:-translate-y-1 transition-all duration-300">
                <h3 class="panel__title">Buttons, Outputs &amp; Hidden / Datetime Inputs</h3>

                <div class="panel__content">

                    <form class="user-form space-y-4"
                        oninput="result.value = (a.valueAsNumber || 0) + (b.valueAsNumber || 0)">
                        <div class="user-form__field">
                            <label class="annotation annotation--block">Hidden Input</label>
                            <input type="hidden" id="hidden-in" name="hidden-field" value="secret-value">
                            <p class="text-xs text-slate-500">This hidden field is submitted but not shown.</p>
                        </div>

                        <div class="user-form__field">
                            <label for="dtlocal-in" class="annotation annotation--block">Date &amp; Time (local)</label>
                            <input type="datetime-local" id="dtlocal-in" class="form-input">
                        </div>

                        <div class="user-form__field">
                            <label class="annotation">Output Element</label>

                            <div class="flex items-center space-x-2">
                                <input type="number" id="a" value="10" class="form-input w-20">
                                <span>+</span>
                                <input type="number" id="b" value="20" class="form-input w-20">
                                <span>=</span>
                                <output name="result" for="a b" class="font-bold">30</output>
                            </div>

                        </div>

                        <div class="user-form__field">
                            <label class="annotation">Progress Bar</label>
                            <progress value="70" max="100" class="w-full">70%</progress>
                        </div>

                        <div class="user-form__field">
                            <label class="annotation">Meter</label>
                            <meter value="0.6" class="w-full">60%</meter>
                        </div>

                        <div class="user-form__control flex space-x-2 pt-2">
                            <button type="submit"
                                class="w-full p-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 font-semibold transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">Submit</button>
                        </div>

                    </form>
                </div>

            </article>

        </div>

    </section>
</body>

</html>
